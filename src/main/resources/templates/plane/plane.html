<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали самолета</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Детали самолета</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>ID:</strong> <span th:text="${plane.id}"></span></li>
            <li class="list-group-item"><strong>Количество мест:</strong> <span th:text="${plane.seats}"></span></li>
            <li class="list-group-item"><strong>Максимальная нагрузка:</strong> <span th:text="${plane.maxLoad}"></span></li>
            <li class="list-group-item"><strong>Модель:</strong> <span th:text="${plane.model}"></span></li>
        </ul>
    </div>
</div>

<div class="d-flex justify-content-center mt-4">
    <a href="/plane/all" class="btn btn-secondary btn-lg">Назад</a>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
