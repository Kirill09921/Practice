<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Создание самолёта</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Создание нового самолёта</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form th:action="@{/plane/create}" th:object="${plane}" method="post">
            <div class="mb-3">
                <label for="seats" class="form-label"><strong>Количество мест</strong></label>
                <input type="number" id="seats" class="form-control" th:field="*{seats}" required>
            </div>
            <div class="mb-3">
                <label for="maxLoad" class="form-label"><strong>Максимальная нагрузка</strong></label>
                <input type="number" id="maxLoad" class="form-control" th:field="*{maxLoad}" required>
            </div>
            <div class="mb-3">
                <label for="model" class="form-label"><strong>Модель</strong></label>
                <input type="text" id="model" class="form-control" th:field="*{model}" required>
            </div>
            <div class="mb-3">
                <label for="registrationNumber" class="form-label"><strong>Регистрационный номер</strong></label>
                <input type="text" id="registrationNumber" class="form-control" th:field="*{registrationNumber}" required>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="/plane/all" class="btn btn-secondary btn-lg">Назад</a>
                <button type="submit" class="btn btn-success btn-lg">Создать самолёт</button>
            </div>
        </form>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
