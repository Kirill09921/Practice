<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список самолетов</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Список самолетов</h1>
<table class="table table-hover table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Количество мест</th>
        <th>Максимальная нагрузка</th>
        <th>Модель</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="plane : ${planes}">
        <td th:text="${plane.id}"></td>
        <td th:text="${plane.seats}"></td>
        <td th:text="${plane.maxLoad}"></td>
        <td th:text="${plane.model}"></td>
        <td><a th:href="@{/plane/{id}(id=${plane.id})}" class="btn btn-secondary btn-lg w-100 h-100">Подробнее</a></td>
    </tr>
    </tbody>
</table>
<div class="d-flex justify-content-center mt-4">
    <a href="/plane/create" class="btn btn-secondary btn-lg">Создать</a>
</div>
<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
