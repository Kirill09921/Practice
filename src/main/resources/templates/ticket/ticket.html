<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали билета</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Детали билета</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>ID:</strong> <span th:text="${ticket.id}"></span></li>
            <li class="list-group-item"><strong>Цена:</strong> <span th:text="${ticket.price}"></span></li>
            <li class="list-group-item"><strong>Детали рейса:</strong> <span th:text="${ticket.flightDetail}"></span></li>
        </ul>
    </div>
</div>

<div class="d-flex justify-content-center mt-4">
    <a href="/ticket/all" class="btn btn-secondary btn-lg mx-2">Назад</a>
    <a th:href="@{/ticket/update/{id}(id=${ticket.id})}" class="btn btn-secondary btn-lg mx-2">Обновить</a>
</div>


<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
