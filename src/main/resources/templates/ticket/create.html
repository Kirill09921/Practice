<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Создание билета</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Создание нового билета</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form th:action="@{/ticket/create}" th:object="${ticket}" method="post">
            <div class="mb-3">
                <label for="price" class="form-label"><strong>Цена</strong></label>
                <input type="number" id="price" class="form-control" th:field="*{price}" required>
            </div>
            <div class="mb-3">
                <label for="flightDetail" class="form-label"><strong>Детали рейса</strong></label>
                <input type="text" id="flightDetail" class="form-control" th:field="*{flightDetail}" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Бронирование</strong></label>
                <label>
                    <input type="text" class="form-control" th:value="${bookingId}" disabled>
                </label>
                <input type="hidden" th:field="*{bookingId}" th:value="${bookingId}" />
            </div>
<!--            <div class="mb-3">-->
<!--                <label for="userId" class="form-label"><strong>Бронирование</strong></label>-->
<!--                <select id="userId" class="form-select" th:field="*{bookingId}" required>-->
<!--                    <option value="">&#45;&#45; выберите бронирование &#45;&#45;</option>-->
<!--                    <option th:each="b : ${bookings}" th:value="${b.id}"-->
<!--                            th:text="${b.getId()}"></option>-->
<!--                </select>-->
<!--            </div>-->
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="/ticket/all" class="btn btn-secondary btn-lg">Назад</a>
                <button type="submit" class="btn btn-success btn-lg">Создать билет</button>
            </div>

        </form>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
