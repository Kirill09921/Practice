<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список билетов</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Список билетов</h1>

<table class="table table-hover table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Цена</th>
        <th>Самолет</th>
        <th>Отправление</th>
        <th>Пункт назначения</th>
        <th>Время отправления</th>
        <th>Время прибытия</th>
        <th></th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticketView : ${ticketViews}">
        <td th:text="${ticketView.ticket.id}"></td>
        <td th:text="${ticketView.ticket.price}"></td>
        <td th:text="${ticketView.plane}"></td>
        <td th:text="${ticketView.departureLocation}"></td>
        <td th:text="${ticketView.destinationLocation}"></td>
        <td th:text="${#temporals.format(ticketView.departureTime, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${#temporals.format(ticketView.destinationTime, 'dd-MM-yyyy HH:mm')}"></td>
        <td><a th:href="@{/ticket/{id}(id=${ticketView.ticket.id})}" class="btn btn-secondary btn-lg w-100 h-100">Подробнее</a></td>
        <td>
            <form th:action="@{/ticket/delete/{id}(id=${ticketView.ticket.id})}" method="post" th:method="delete">
                <button type="submit" class="btn btn-danger btn-lg w-100 h-100"
                        onclick="return confirm('Вы уверены, что хотите удалить билет?');">
                    Удалить
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div class="d-flex justify-content-center mt-4">
    <a href="/ticket/create" class="btn btn-secondary btn-lg">Создать</a>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
