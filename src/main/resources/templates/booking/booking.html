<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали бронирования</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Детали бронирования</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>ID:</strong> <span th:text="${booking.id}"></span></li>
            <li class="list-group-item"><strong>Время:</strong> <span th:text="${booking.time}"></span></li>
            <li class="list-group-item"><strong>Время отправления:</strong> <span th:text="${booking.departureTime}"></span></li>
            <li class="list-group-item"><strong>Время прибытия:</strong> <span th:text="${booking.arrivalTime}"></span></li>
            <li class="list-group-item"><strong>Место отправления:</strong> <span th:text="${booking.departureLocation}"></span></li>
            <li class="list-group-item"><strong>Место прибытия:</strong> <span th:text="${booking.arrivalLocation}"></span></li>
        </ul>
    </div>
</div>

<div class="d-flex justify-content-center mt-4">
    <a href="/booking/all" class="btn btn-secondary btn-lg mx-2">Назад</a>
    <a th:href="@{/booking/update/{id}(id=${booking.id})}" class="btn btn-secondary btn-lg mx-2">Обновить</a>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
