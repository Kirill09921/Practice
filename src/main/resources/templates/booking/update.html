<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование бронирования</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Редактирование бронирования</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form th:action="@{/booking/update/{id}(id=${booking.id})}" th:object="${booking}" method="post" th:method="put">
            <div class="mb-3">
                <label for="time" class="form-label"><strong>Время</strong></label>
                <input type="text" id="time" class="form-control" th:field="*{time}">
            </div>
            <div class="mb-3">
                <label for="departureTime" class="form-label"><strong>Время отправления</strong></label>
                <input type="text" id="departureTime" class="form-control" th:field="*{departureTime}">
            </div>
            <div class="mb-3">
                <label for="arrivalTime" class="form-label"><strong>Время прибытия</strong></label>
                <input type="text" id="arrivalTime" class="form-control" th:field="*{arrivalTime}">
            </div>
            <div class="mb-3">
                <label for="departureLocation" class="form-label"><strong>Место отправления</strong></label>
                <input type="text" id="departureLocation" class="form-control" th:field="*{departureLocation}">
            </div>
            <div class="mb-3">
                <label for="arrivalLocation" class="form-label"><strong>Место прибытия</strong></label>
                <input type="text" id="arrivalLocation" class="form-control" th:field="*{arrivalLocation}">
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="/booking/all" class="btn btn-secondary btn-lg">Назад</a>
                <button type="submit" class="btn btn-success btn-lg">Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
