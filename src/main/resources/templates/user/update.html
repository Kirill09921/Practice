<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование пользователя</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Редактирование пользователя</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form th:action="@{/user/update/{id}(id=${user.id})}" th:object="${user}" method="post" th:method="put">
            <div class="mb-3">
                <label for="username" class="form-label"><strong>Имя пользователя</strong></label>
                <input type="text" id="username" class="form-control" th:field="*{username}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label"><strong>Email</strong></label>
                <input type="email" id="email" class="form-control" th:field="*{email}">
            </div>
            <div class="mb-3">
                <label for="login" class="form-label"><strong>Логин</strong></label>
                <input type="text" id="login" class="form-control" th:field="*{login}">
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="/user/all" class="btn btn-secondary btn-lg">Назад</a>
                <button type="submit" class="btn btn-success btn-lg">Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
