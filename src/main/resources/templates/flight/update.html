<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Редактирование рейса</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="layout/header :: header"></div>
<h1 class="text-center mb-4">Редактирование рейса</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <form th:action="@{/flight/update/{id}(id=${flight.id})}" th:object="${flight}" method="post" th:method="put">
      <div class="mb-3">
        <label for="departure" class="form-label"><strong>Пункт отправления</strong></label>
        <input type="text" id="departure" class="form-control" th:field="*{departure}">
      </div>
      <div class="mb-3">
        <label for="destination" class="form-label"><strong>Пункт назначения</strong></label>
        <input type="text" id="destination" class="form-control" th:field="*{destination}">
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="/flight/all" class="btn btn-secondary btn-lg">Назад</a>
        <button type="submit" class="btn btn-success btn-lg">Сохранить изменения</button>
      </div>
    </form>
  </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
